<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Application - AR INFOTEK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#1e5aa8', accent: '#ff891c' } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-bg { background: linear-gradient(to bottom right, #1e5aa8, #103466, #0f172a); }
    .form-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); }
    input, select, textarea {
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #1e5aa8;
      box-shadow: 0 0 0 3px rgba(30,90,168,0.1);
    }
  </style></head><body class="hero-bg min-h-screen">

  <header class="bg-white py-6 shadow-sm border-b border-slate-200">
    <div class="max-w-screen-2xl mx-auto px-8 flex items-center relative w-full">
      <img src="arinfotek_logo.png" alt="AR INFOTEK" class="h-14 w-auto flex-shrink-0 z-10">
      <h1 class="absolute left-1/2 -translate-x-1/2 text-5xl font-black tracking-[0.04em] text-primary whitespace-nowrap">
        Application for Internship
      </h1>
    </div>
  </header>

  <div class="max-w-3xl mx-auto px-6 py-12">
    <div class="text-center mb-12">
      <h2 class="text-5xl font-black text-white leading-tight">Internship Application</h2>
    </div>

    <div class="form-card rounded-3xl p-10 shadow-2xl border border-white/20">
      <form id="myForm"
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSecUB6CIz1nubruzj1BUYkHrHNPILcG3AHSO5h19Am16U-iyg/formResponse"
            method="POST"
            target="hidden_iframe"
            class="space-y-8">

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name <span class="text-red-500">*</span></label>
            <input type="text" name="entry.1367685117" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300 text-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Date of Birth <span class="text-red-500">*</span></label>
            <input type="date" name="entry.1946924470" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Gender <span class="text-red-500">*</span></label>
          <select name="entry.675238853" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300 bg-white">
            <option value="">Choose</option>
            <option value="MALE">MALE</option>
            <option value="FEMALE">FEMALE</option>
          </select>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Contact Number <span class="text-red-500">*</span></label>
            <input type="text" name="entry.1805792394" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Alternate Number <span class="text-red-500">*</span></label>
            <input type="text" name="entry.181938629" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Home Address <span class="text-red-500">*</span></label>
          <textarea name="entry.1238312499" rows="3" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">College Name <span class="text-red-500">*</span></label>
          <input type="text" name="entry.1573054466" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Degree <span class="text-red-500">*</span></label>
          <select name="entry.2146682057" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300 bg-white">
            <option value="">Choose</option>
            <option value="Diploma">Diploma</option>
            <option value="B.E">B.E</option>
            <option value="B.Tech">B.Tech</option>
            <option value="Mca">Mca</option>
            <option value="Msc">Msc</option>
            <option value="Bsc">Bsc</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Branch <span class="text-red-500">*</span></label>
          <select name="entry.663595307" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300 bg-white">
            <option value="">Choose</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics and Communication">Electronics and Communication</option>
          </select>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Year <span class="text-red-500">*</span></label>
            <select name="entry.1419686933" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300 bg-white">
              <option value="">Choose</option>
              <option value="First">First</option>
              <option value="Second">Second</option>
              <option value="Third">Third</option>
              <option value="Fourth">Fourth</option>
              <option value="Fifth">Fifth</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Semester <span class="text-red-500">*</span></label>
            <select name="entry.1118309627" required
              class="w-full px-6 py-4 rounded-2xl border border-slate-300 bg-white">
              <option value="">Choose</option>
              <option value="First">First</option>
              <option value="Second">Second</option>
              <option value="Third">Third</option>
              <option value="Fourth">Fourth</option>
              <option value="FIfth">FIfth</option>
              <option value="Sixth">Sixth</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Student Registration ID (as given in college ID card) <span class="text-red-500">*</span></label>
          <input type="text" name="entry.1158056919" required
            class="w-full px-6 py-4 rounded-2xl border border-slate-300">
        </div>

        <button type="submit"
          class="w-full py-6 bg-gradient-to-r from-accent to-orange-600 text-white font-bold text-lg rounded-2xl hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 mt-8">
          Submit Internship Application
        </button>
      </form>
    </div>
  </div>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <script>
    window.onload = function () {
      const form = document.getElementById("myForm");
      const iframe = document.querySelector("iframe");

      form.onsubmit = () => setTimeout(showThankYou, 1200);
      iframe.onload = showThankYou;
    };

    function showThankYou() {
      document.querySelector('.form-card').innerHTML = `
        <div class="text-center py-20 px-6">
          <div class="text-7xl mb-6">✅</div>
          <h2 class="text-3xl font-bold text-green-600 mb-3">Application Submitted Successfully!</h2>
          <p class="text-slate-600 text-lg">Thank you! Our team will review your application and contact you soon.</p>
          <button onclick="location.reload()"
            class="mt-10 px-10 py-4 bg-primary text-white font-bold rounded-2xl hover:bg-blue-700 transition">
            Submit Another Application
          </button>
        </div>
      `;
    }
  </script>
</body></html>
